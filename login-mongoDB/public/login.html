<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Login</title>

  <link rel="stylesheet" href="style.css">
  <link rel="shortcut icon" href="WhatsApp Image 2026-06-01 at 3.57.12 PM.jpeg" type="image/x-icon">

</head>

<body>

<div class="container">

  <h1>Iniciar Sesión</h1>

  <form id="loginForm">

    <input
      type="email"
      id="email"
      placeholder="Email"
      required
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
      required
    >

    <button type="submit">
      Entrar
    </button>

  </form>

  <p>
    ¿No tienes cuenta?
    <a href="/register.html">
      Regístrate
    </a>
  </p>

</div>

<script src="app.js"></script>

</body>
</html>
