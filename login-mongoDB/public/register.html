
<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Registro</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

  <h1>Crear Cuenta</h1>

  <form id="registerForm">

    <input
      type="text"
      id="username"
      placeholder="Usuario"
      required
    >

    <input
      type="email"
      id="email"
      placeholder="Email"
      required
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
      required
    >

    <button type="submit">
      Registrarse
    </button>

  </form>

  <p>
    ¿Ya tienes cuenta?
    <a href="/login.html">
      Inicia sesión
    </a>
  </p>

</div>

<script src="app.js"></script>

</body>
</html>
