<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Free Studian</title>
    <link rel="stylesheet" href="/styles/style.css">
</head>
<body>

    <!-- LOGIN -->
    <div id="login">
        <h1>Free Studian</h1>
        <input type="text" id="username" placeholder="Usuario">
        <input type="password" id="password" placeholder="Contraseña">
        <button onclick="login()">Ingresar</button>
        <button onclick="register()">Registrarse</button>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard" class="hidden">
        <h2>Bienvenido, <span id="userDisplay"></span></h2>
        <p>Puntos: <span id="points">0</span></p>

        <h3>Retos</h3>
        <button onclick="completeChallenge()">Completar reto (+10 puntos)</button>

        <h3>Chatbot</h3>
        <div id="chatbox"></div>
        <input type="text" id="chatInput" placeholder="Escribe tu pregunta...">
        <button onclick="sendMessage()">Enviar</button>

        <br><br>
        <button onclick="logout()">Cerrar sesión</button>
    </div>

<script src="/script/script.js"></script>
</body>
</html>
